name: Forecast Engine

on:
  schedule:
    - cron: "0 22 * * 1-5"   # weekdays 22:00 UTC, after research/rotation
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker for an on-demand run (blank = full universe post-close batch)"
        required: false
      price:
        description: "Manual effective price (marks intraday_proxy=true). Requires ticker."
        required: false
      dry_run:
        description: "Compute and print only; skip the Supabase write"
        required: false
        type: boolean
        default: false
      source:
        description: "Tag for features_json.source, e.g. 'chat' (blank = on_demand/batch default)"
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Run forecast engine
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.ticker }}" ]; then
            ARGS="$ARGS --ticker ${{ inputs.ticker }}"
          fi
          if [ -n "${{ inputs.price }}" ]; then
            ARGS="$ARGS --price ${{ inputs.price }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          python scripts/forecast_engine.py $ARGS
      # B4: commits data/pending_forecast_writes.jsonl if the run above
      # staged anything new or recovered/cleared anything staged by a
      # prior run -- this is what makes "retried on the next run" actually
      # true. A GitHub Actions runner is ephemeral; without committing this
      # file back, whatever got staged here would vanish with the
      # container, and the "next run" would never see it. `if: always()`
      # so this runs even when the step above exits non-zero (a failed
      # run staging a new entry is exactly the case that most needs to
      # survive) -- the job's own conclusion still correctly reflects that
      # step's failure regardless of what a later step does.
      - name: Commit pending-write queue if changed
        if: always()
        run: |
          git config user.name "rotation-radar-bot"
          git config user.email "actions@github.com"
          git add data/pending_forecast_writes.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change to the pending-write queue"
            exit 0
          fi
          git commit -m "Update pending forecast write queue"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed -- pulling --rebase and retrying"
            git pull --rebase origin main
          done
          echo "::error::Failed to push pending-write queue after 3 attempts"
          exit 1
