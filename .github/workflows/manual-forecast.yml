name: Manual Forecast Refresh

# Deliberately manual-only (no schedule trigger) and always full-universe
# (no ticker input) -- a single, unambiguous "refresh every forecast row
# right now" button, distinct from Forecast Engine's on-demand single-
# ticker dispatch (which also has a workflow_dispatch trigger, but is
# meant for chat-triggered one-off ticker runs, not a full watchlist
# refresh).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print only; skip the Supabase write"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-full-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Run full-universe forecast refresh
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/forecast_engine.py $ARGS
      # B4: see forecast-engine.yml's identical step for why this exists
      # and why if: always() matters here.
      - name: Commit pending-write queue if changed
        if: always()
        run: |
          git config user.name "rotation-radar-bot"
          git config user.email "actions@github.com"
          git add data/pending_forecast_writes.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change to the pending-write queue"
            exit 0
          fi
          git commit -m "Update pending forecast write queue"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed -- pulling --rebase and retrying"
            git pull --rebase origin main
          done
          echo "::error::Failed to push pending-write queue after 3 attempts"
          exit 1
